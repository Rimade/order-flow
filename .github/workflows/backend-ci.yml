name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  nest-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - order-service
          - catalog-service
    defaults:
      run:
        working-directory: backend/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://orderflow:orderflow@localhost:5433/orderflow_order

  go-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - inventory-service
          - payment-service
          - notification-service
          - analytics-service
    defaults:
      run:
        working-directory: backend/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/${{ matrix.service }}/go.mod
          cache-dependency-path: backend/services/${{ matrix.service }}/go.sum

      - name: Go test
        run: go test ./...

      - name: Go build
        run: go build -o /tmp/${{ matrix.service }} ./cmd/server

  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check OpenAPI markers
        run: node backend/scripts/ci-openapi-check.js

      - name: Gateway openapi:check
        working-directory: backend/services/api-gateway
        run: |
          npm ci
          npm run openapi:check

  compose-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start postgres and redis
        working-directory: backend/infra/compose
        run: docker compose up -d postgres redis

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec orderflow-postgres pg_isready -U orderflow >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres not ready"
          exit 1

      - name: Redis ping
        run: docker exec orderflow-redis redis-cli ping

      - name: Compose down
        if: always()
        working-directory: backend/infra/compose
        run: docker compose down -v

  smoke-auth-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start postgres and redis
        working-directory: backend/infra/compose
        run: docker compose up -d postgres redis

      - name: Wait for postgres + auth DB + redis
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if docker exec orderflow-postgres pg_isready -U orderflow >/dev/null 2>&1 \
              && docker exec orderflow-postgres psql -U orderflow -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='orderflow_auth'" | grep -q 1 \
              && docker exec orderflow-redis redis-cli ping | grep -q PONG; then
              echo "infra ready"
              exit 0
            fi
            sleep 2
          done
          echo "infra not ready"
          docker ps -a || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/services/auth-service/package-lock.json
            backend/services/api-gateway/package-lock.json

      - name: Install, migrate, build, smoke
        run: |
          set -euo pipefail

          cp backend/services/auth-service/.env.example backend/services/auth-service/.env
          cp backend/services/api-gateway/.env.example backend/services/api-gateway/.env

          (cd backend/services/auth-service && npm ci && npx prisma migrate deploy && npm run build)
          (cd backend/services/api-gateway && npm ci && npm run build)

          # Keep processes in THIS step — GHA kills background jobs between steps
          (cd backend/services/auth-service && node dist/main > /tmp/auth.log 2>&1) &
          AUTH_PID=$!
          (cd backend/services/api-gateway && node dist/main > /tmp/gateway.log 2>&1) &
          GW_PID=$!

          cleanup() {
            kill $AUTH_PID $GW_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null \
              && curl -sf http://127.0.0.1:3000/health >/dev/null; then
              echo "auth + gateway healthy"
              break
            fi
            if ! kill -0 $AUTH_PID 2>/dev/null; then
              echo "auth-service exited early"
              cat /tmp/auth.log || true
              exit 1
            fi
            if ! kill -0 $GW_PID 2>/dev/null; then
              echo "api-gateway exited early"
              cat /tmp/gateway.log || true
              exit 1
            fi
            if [ "$i" -eq 60 ]; then
              echo "=== auth log ==="
              cat /tmp/auth.log || true
              echo "=== gateway log ==="
              cat /tmp/gateway.log || true
              exit 1
            fi
            sleep 2
          done

          EMAIL="ci-$(date +%s)@example.com"
          PASS='password123'

          curl -sf -X POST http://127.0.0.1:3000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" \
            -o /tmp/register.json

          curl -sf -X POST http://127.0.0.1:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" \
            -o /tmp/login.json

          TOKEN=$(node -e "const j=require('/tmp/login.json'); if(!j.accessToken) process.exit(1); process.stdout.write(j.accessToken)")

          curl -sf http://127.0.0.1:3000/api/v1/auth/me \
            -H "Authorization: Bearer $TOKEN" \
            -o /tmp/me.json

          node -e "const m=require('/tmp/me.json'); if(!m.email) process.exit(1); console.log('OK me', m.email)"

      - name: Compose down
        if: always()
        working-directory: backend/infra/compose
        run: docker compose down -v

  # Full Playwright saga needs Nest+Go on the runner — run locally.
  # See client/e2e and backend/docs/local-dev-routine.md
