apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orderflow
# Built with: kubectl kustomize --load-restrictor LoadRestrictionsNone overlays/smoke
resources:
  - ../../base
  - ../../apps/api-gateway.yaml
  - ../../apps/auth-service.yaml
images:
  - name: orderflow/api-gateway
    newTag: local
  - name: orderflow/auth-service
    newTag: local
