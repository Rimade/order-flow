apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secrets
  namespace: orderflow
type: Opaque
stringData:
  # Learning defaults — change before any shared/demo cluster
  POSTGRES_USER: orderflow
  POSTGRES_PASSWORD: orderflow
  JWT_ACCESS_SECRET: change-me-access-secret
  JWT_REFRESH_SECRET: change-me-refresh-secret
  DATABASE_URL_AUTH: postgresql://orderflow:orderflow@host.docker.internal:5433/orderflow_auth
  DATABASE_URL_ORDER: postgresql://orderflow:orderflow@host.docker.internal:5433/orderflow_order
  DATABASE_URL_CATALOG: postgresql://orderflow:orderflow@host.docker.internal:5433/orderflow_catalog
  DATABASE_URL_INVENTORY: postgresql://orderflow:orderflow@host.docker.internal:5433/orderflow_inventory?sslmode=disable
  DATABASE_URL_PAYMENT: postgresql://orderflow:orderflow@host.docker.internal:5433/orderflow_payment?sslmode=disable
  DATABASE_URL_NOTIFICATION: postgresql://orderflow:orderflow@host.docker.internal:5433/orderflow_notification?sslmode=disable
  DATABASE_URL_ANALYTICS: postgresql://orderflow:orderflow@host.docker.internal:5433/orderflow_analytics?sslmode=disable
