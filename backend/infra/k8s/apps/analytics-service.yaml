apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: orderflow
  labels:
    app.kubernetes.io/name: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: orderflow/analytics-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3007
              name: http
          envFrom:
            - configMapRef:
                name: orderflow-config
          env:
            - name: PORT
              value: "3007"
            - name: OTEL_SERVICE_NAME
              value: analytics-service
            - name: KAFKA_CONSUMER_GROUP
              value: analytics-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: DATABASE_URL_ANALYTICS
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "250m"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: orderflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: analytics-service
  ports:
    - name: http
      port: 3007
      targetPort: http
