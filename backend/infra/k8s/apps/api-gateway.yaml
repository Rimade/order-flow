apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: orderflow
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: orderflow/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: orderflow-config
          env:
            - name: PORT
              value: "3000"
            - name: OTEL_SERVICE_NAME
              value: api-gateway
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: JWT_ACCESS_SECRET
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: orderflow
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30000
